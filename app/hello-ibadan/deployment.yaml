apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-ibadan
  labels:
    app: hello-ibadan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-ibadan
      pipecd.dev/variant: primary
  template:
    metadata:
      labels:
        app: hello-ibadan
        pipecd.dev/variant: primary
    spec:
      containers:
        - name: helloworld
          image: ghcr.io/pipe-cd/helloworld:v0.47.1
          args:
            - server
          ports:
            - containerPort: 9085
