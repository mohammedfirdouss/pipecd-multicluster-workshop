apiVersion: pipecd.dev/v1beta1
kind: Application
spec:
  name: hello-ibadan
  labels:
    workshop: devfest-ibadan-2026
  pipeline:
    stages:
      # 1. Start one pod of the new version next to the old one, on every cluster.
      - name: K8S_MULTI_CANARY_ROLLOUT
        with:
          replicas: 1
      # 2. Give it 30 seconds. In real life this is where analysis or approval goes.
      - name: WAIT
        with:
          duration: 30s
      # 3. Promote: the new version becomes the primary on every cluster.
      - name: K8S_MULTI_PRIMARY_ROLLOUT
      # 4. Remove the canary pods.
      - name: K8S_MULTI_CANARY_CLEAN
  plugins:
    kubernetes_multicluster:
      input:
        manifests:
          - deployment.yaml
          - service.yaml
        kubectlVersion: 1.32.2
