<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">How the workshop works</text>

  <!-- GitHub -->
  <rect x="20" y="150" width="200" height="130" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="120" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Your fork on GitHub</text>
  <text x="120" y="220" text-anchor="middle" font-size="15" fill="#334155">app/hello-ibadan/</text>
  <text x="120" y="245" text-anchor="middle" font-size="15" fill="#334155">(the files you edit)</text>

  <!-- You -->
  <rect x="40" y="340" width="160" height="60" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="120" y="377" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">You</text>
  <line x1="120" y1="338" x2="120" y2="284" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="130" y="316" font-size="14" fill="#334155">git push</text>

  <!-- Laptop -->
  <rect x="300" y="70" width="630" height="370" rx="16" fill="#f8fafc" stroke="#0f172a" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="320" y="98" font-size="16" font-weight="700" fill="#0f172a">Your laptop</text>

  <!-- piped -->
  <rect x="330" y="175" width="170" height="80" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="415" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">piped</text>
  <text x="415" y="234" text-anchor="middle" font-size="14" fill="#1e3a8a">does the deploying</text>

  <!-- GitHub -> piped -->
  <line x1="222" y1="215" x2="326" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="261" y="203" text-anchor="middle" font-size="13" fill="#334155">reads main</text>
  <text x="261" y="236" text-anchor="middle" font-size="13" fill="#334155">every 30s</text>

  <!-- cluster1 -->
  <rect x="580" y="110" width="320" height="150" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="740" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">cluster1 (kind)</text>
  <rect x="600" y="155" width="135" height="85" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="667" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">PipeCD</text>
  <text x="667" y="210" text-anchor="middle" font-size="13" fill="#14532d">console at</text>
  <text x="667" y="228" text-anchor="middle" font-size="13" fill="#14532d">localhost:8080</text>
  <rect x="750" y="155" width="135" height="85" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="817" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">hello-ibadan</text>

  <!-- cluster2 -->
  <rect x="580" y="285" width="320" height="130" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="740" y="315" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">cluster2 (kind)</text>
  <rect x="750" y="330" width="135" height="70" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="817" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">hello-ibadan</text>

  <!-- piped <-> PipeCD -->
  <line x1="502" y1="200" x2="596" y2="200" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="549" y="190" text-anchor="middle" font-size="13" fill="#334155">reports</text>

  <!-- piped -> clusters -->
  <path d="M500,240 C560,260 690,262 746,215" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M470,257 C500,340 650,368 746,365" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="395" y="305" text-anchor="middle" font-size="13" fill="#334155">deploys to</text>
  <text x="395" y="322" text-anchor="middle" font-size="13" fill="#334155">both clusters</text>
</svg>
